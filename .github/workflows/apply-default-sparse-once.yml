name: Apply tested sparse-default patch

on:
  push:
    branches:
      - default-sparse-project-json

permissions:
  contents: write

jobs:
  apply-tested-patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: default-sparse-project-json
          fetch-depth: 0
      - name: Apply exact locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/default-sparse-patch-{1,2,3,4,5}.txt > /tmp/default-sparse.patch.gz.b64
          base64 -d /tmp/default-sparse.patch.gz.b64 > /tmp/default-sparse.patch.gz
          gzip -dc /tmp/default-sparse.patch.gz > /tmp/default-sparse.patch
          patch -p2 --batch < /tmp/default-sparse.patch
          rm .github/default-sparse-patch-{1,2,3,4,5}.txt
          test ! -e iccplus_rc14_source
          test ! -e iccplus_pr9
      - name: Verify tests
        run: python -m pytest -q tests cli_tests
      - name: Verify checked-in examples
        run: ./examples/test_examples.sh
      - name: Commit tested project changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make sparse project JSON the default output'
          git push origin HEAD:default-sparse-project-json
