name: Manual release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version/tag text to use for this release
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run maintained tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          sh ./run-tests
          bash ./examples/test_examples.sh

      - name: Apply requested release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/set_version.py "$RELEASE_VERSION"
          python -m pytest -q tests/test_version_consistency.py
          python scripts/build_release_archives.py \
            --output-dir release-dist \
            --source-ref PREVIEW

      - name: Commit version update
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION iccplus_tools/version.py pyproject.toml README.md START_HERE.md docs/CLI_REFERENCE.md skills/iccplus-local/SKILL.md
          if ! git diff --cached --quiet; then
            git commit -m "Set release version to $RELEASE_VERSION"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build release ZIPs
        run: |
          python scripts/build_release_archives.py \
            --output-dir release-dist \
            --source-ref "${RELEASE_SHA}"
          unzip -l release-dist/iccplus-local-full-*.zip | head -80
          unzip -l release-dist/iccplus-viewer-test-*.zip | head -80
          cat release-dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: iccplus-local-release-${{ github.run_number }}
          path: release-dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists." >&2
            exit 1
          fi
          args=("$RELEASE_VERSION" --target "$RELEASE_SHA" --title "$RELEASE_VERSION" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" \
            release-dist/iccplus-local-full-*.zip \
            release-dist/iccplus-viewer-test-*.zip \
            release-dist/SHA256SUMS.txt
