name: Manual release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to create for this release (for example v0.10.0rc16)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run maintained tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
          sh ./run-tests
          bash ./examples/test_examples.sh

      - name: Build release ZIPs
        run: |
          python scripts/build_release_archives.py \
            --output-dir release-dist \
            --source-ref "${GITHUB_SHA}"
          unzip -l release-dist/iccplus-local-full-*.zip | head -80
          unzip -l release-dist/iccplus-viewer-test-*.zip | head -80
          cat release-dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: iccplus-local-release-${{ inputs.tag }}
          path: release-dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace an existing release." >&2
            exit 1
          fi
          args=("$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" \
            release-dist/iccplus-local-full-*.zip \
            release-dist/iccplus-viewer-test-*.zip \
            release-dist/SHA256SUMS.txt
