name: Tests

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: Core runtime and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run core regression suite
        run: python -m pytest -q tests

  cli-tests:
    name: CLI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run CLI regression suite
        run: python -m pytest -q cli_tests

  examples:
    name: Checked-in examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run checked-in examples
        run: ./examples/test_examples.sh

  release-artifacts:
    name: Build release artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - core-tests
      - cli-tests
      - examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build release artifacts
        run: |
          python scripts/build_release_archives.py \
            --output-dir release-dist \
            --source-ref "${GITHUB_SHA}"
          cat release-dist/SHA256SUMS.txt
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iccplus-local-release
          path: release-dist/*
          if-no-files-found: error
