name: Apply sparse-default patch

on:
  push:
    branches:
      - default-sparse-project-json
    paths:
      - .github/sparse-default.patch.gz.b64
      - .github/workflows/apply-sparse-default.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: default-sparse-project-json
          fetch-depth: 0
      - name: Apply tested patch
        shell: bash
        run: |
          base64 -d .github/sparse-default.patch.gz.b64 | gzip -d > /tmp/sparse-default.patch
          git apply -p2 --whitespace=error-all /tmp/sparse-default.patch
          rm .github/sparse-default.patch.gz.b64 .github/workflows/apply-sparse-default.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make sparse JSON the default output"
          git push origin HEAD:default-sparse-project-json
