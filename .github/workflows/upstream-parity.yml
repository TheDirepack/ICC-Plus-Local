name: Pinned upstream Viewer parity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-viewer-differential:
    name: Official ICC Plus 2 Viewer differential
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Local runtime
        run: python -m pip install -e .
      - name: Verify Chrome availability
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            echo "Chrome/Chromium is missing on the runner" >&2
            exit 1
          fi
      - name: Differential test against pinned official Viewer
        run: python online_tests/run_live_parity.py
